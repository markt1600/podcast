name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Core

  ios-build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SkipCast.xcodeproj \
            -scheme SkipCast \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee build.log | grep -E "error|warning: unre|BUILD|\.swift:[0-9]+" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro)?( Max)? \(" | head -1 | sed 's/ ($//')
          echo "Using $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/SkipCast.app
          mkdir -p screenshots
          # Open each tab in turn; the app must still be running after a few seconds.
          for tab in 1 3 0 2; do
            xcrun simctl launch booted com.skipcast.app -selectedTab $tab
            sleep 25
            xcrun simctl io booted screenshot "screenshots/tab-$tab.png"
            xcrun simctl spawn booted launchctl list | grep -q com.skipcast.app || { echo "::error::App is not running after launch ($tab$screen)"; touch app-died; }
            xcrun simctl terminate booted com.skipcast.app
          done
          for screen in player show; do
            xcrun simctl launch booted com.skipcast.app -selectedTab 0 -demoScreen $screen
            sleep 40
            xcrun simctl io booted screenshot "screenshots/$screen.png"
            # What is the main thread doing? (A simulator app is an ordinary host process.)
            sample "$(pgrep -x SkipCast | head -1)" 2 -file "sample-$screen.txt" >/dev/null 2>&1 || true
            sed -n '/Call graph/,/Total number/p' "sample-$screen.txt" | head -45 || true
            xcrun simctl spawn booted launchctl list | grep -q com.skipcast.app || { echo "::error::App is not running after launch ($tab$screen)"; touch app-died; }
            xcrun simctl terminate booted com.skipcast.app
          done
          if [ -f app-died ]; then
            echo "---- crash reports"
            ls ~/Library/Logs/DiagnosticReports/ | grep -i skipcast || true
            for f in ~/Library/Logs/DiagnosticReports/SkipCast*.ips; do [ -f "$f" ] && python3 -c "
          import json,sys
          t=open(sys.argv[1]).read(); head,body=t.split('\n',1); d=json.loads(body)
          print(d.get('exception'), d.get('termination'))
          print(d.get('asi'))
          ft=d.get('faultingThread',0); imgs=d['usedImages']
          for fr in d['threads'][ft]['frames'][:40]: print(imgs[fr['imageIndex']].get('name'), fr.get('symbol'), fr.get('sourceFile',''), fr.get('sourceLine',''))
          " "$f" && break; done
            xcrun simctl spawn booted log show --last 6m --predicate 'process == "SkipCast" AND (messageType == error OR messageType == fault)' | tail -40 || true
            exit 1
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
