name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Core

  ios-build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SkipCast.xcodeproj \
            -scheme SkipCast \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee build.log | grep -E "error|warning: unre|BUILD|\.swift:[0-9]+" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro)?( Max)? \(" | head -1 | sed 's/ ($//')
          echo "Using $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/SkipCast.app
          mkdir -p screenshots
          # Open each tab in turn; the app must still be running after a few seconds.
          for tab in 1 3 0; do
            xcrun simctl launch booted com.skipcast.app -selectedTab $tab
            sleep 25
            xcrun simctl io booted screenshot "screenshots/tab-$tab.png"
            xcrun simctl spawn booted launchctl list | grep -q com.skipcast.app
            xcrun simctl terminate booted com.skipcast.app
          done
          for screen in player show; do
            xcrun simctl launch booted com.skipcast.app -selectedTab 0 -demoScreen $screen
            sleep 25
            xcrun simctl io booted screenshot "screenshots/$screen.png"
            xcrun simctl spawn booted launchctl list | grep -q com.skipcast.app
            xcrun simctl terminate booted com.skipcast.app
          done
          # Give automatic downloads a minute, then show what landed on disk.
          xcrun simctl launch booted com.skipcast.app -selectedTab 2
          sleep 75
          xcrun simctl io booted screenshot "screenshots/downloads.png"
          ls -la "$(xcrun simctl get_app_container booted com.skipcast.app data)/Library/Application Support/Episodes" | head -30 || true
          xcrun simctl spawn booted log show --last 3m --info --predicate 'subsystem == "com.skipcast.app"' | tail -40 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
